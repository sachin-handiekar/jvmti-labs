name: Build JVMTI Labs

on:
  push:
    paths:
      - '**.c'
      - '**.h'
      - '**.java'
      - '**CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - '**.java'
      - '**CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        project:
          - lab01_capability_checker
          - lab02_basic_agent
          - lab03_event_registration
          - lab04_thread_class_inspection
          - lab05_heap_stack_agent
          - lab06_class_transform_agent
          - lab06b_class_patcher
          - lab07_jvm_runtime_agent
          - lab08_exception_agent
          - lab09_advanced_techniques
          - lab10_profiler_agent
          - lab11_deployment_agent
          - lab12_stability_agent
          - lab13_allocation_tracker

    runs-on: ubuntu-latest
    name: ${{ matrix.project }} (JDK ${{ matrix.java }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Configure CMake
        working-directory: ${{ matrix.project }}
        run: cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build agent
        working-directory: ${{ matrix.project }}
        run: cmake --build build --config Release

      # Runs the lab's test app with the agent loaded and checks the
      # agent's output for the behaviour the lab demonstrates
      - name: Run test app and verify output
        run: bash ci/run_lab.sh ${{ matrix.project }}

      - name: Upload build artifacts
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-ubuntu
          path: ${{ matrix.project }}/build/
          retention-days: 7
