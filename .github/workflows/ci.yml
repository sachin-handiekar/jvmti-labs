name: Build JVMTI Labs

on:
  push:
    paths:
      - '**.c'
      - '**.h'
      - '**.java'
      - '**CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - '**.java'
      - '**CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs every supported JDK; macOS (Clang) and Windows (MSVC)
        # run one, to prove the labs build and work on each platform
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21', '25']
        project:
          - lab01_capability_checker
          - lab02_basic_agent
          - lab03_event_registration
          - lab04_thread_class_inspection
          - lab04b_virtual_threads
          - lab05_heap_stack_agent
          - lab06_class_transform_agent
          - lab06b_class_patcher
          - lab07_jvm_runtime_agent
          - lab08_exception_agent
          - lab08b_mini_debugger
          - lab09_advanced_techniques
          - lab10_profiler_agent
          - lab11_deployment_agent
          - lab12_stability_agent
          - lab13_allocation_tracker
        exclude:
          # Virtual threads and their JVMTI API need JDK 21+
          - java: '17'
            project: lab04b_virtual_threads
          - os: macos-latest
            java: '17'
          - os: macos-latest
            java: '25'
          - os: windows-latest
            java: '17'
          - os: windows-latest
            java: '25'

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.project }} (${{ matrix.os }}, JDK ${{ matrix.java }})

    defaults:
      run:
        shell: bash   # Git Bash on Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # On failure, compiler errors and warnings are also reported as
      # annotations, so they show on the run's page without opening logs
      - name: Configure and build agent (warnings are errors)
        working-directory: ${{ matrix.project }}
        run: |
          if ! { cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON &&
                 cmake --build build --config Release; } > build.log 2>&1; then
            cat build.log
            grep -iE '(error|warning)[ :]' build.log | head -10 |
              while IFS= read -r line; do
                echo "::error title=${{ matrix.project }} build::${line//%/%25}"
              done
            exit 1
          fi
          cat build.log

      # Runs the lab's test app with the agent loaded and checks the
      # agent's output for the behaviour the lab demonstrates
      - name: Run test app and verify output
        run: bash ci/run_lab.sh ${{ matrix.project }}

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-ubuntu
          path: ${{ matrix.project }}/build/
          retention-days: 7
